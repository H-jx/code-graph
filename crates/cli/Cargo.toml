[package]
name = "project-knowledge-cli"
description = "project-knowledge 命令行入口：init / index / collect / agent / query / generate / status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "project-knowledge"
path = "src/main.rs"

[features]
default = ["agent", "syntax"]
# 内置 Rig Agent 命令；关掉后 CLI 体积更小，基础索引与查询不受影响
agent = ["dep:project-knowledge-agent"]
syntax = ["project-knowledge-core/syntax"]

[dependencies]
project-knowledge-core = { workspace = true }
project-knowledge-agent = { workspace = true, optional = true }

clap = { workspace = true }
clap_complete = { workspace = true }
dialoguer = { workspace = true }
comfy-table = { workspace = true }
indicatif = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = { workspace = true }
