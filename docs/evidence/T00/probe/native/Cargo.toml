[package]
name = "t00-native-probe"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.97.1"

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
project-knowledge-core.workspace = true
serde_json.workspace = true
schemars.workspace = true
napi = { version = "=3.15.0", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "=3.6.13"

[build-dependencies]
napi-build = "=2.6.0"
