name: Project Knowledge CI

# Rust 和 Node 工作区验证，包括 Core-only 构建与原生绑定、SDK、MCP 集成测试。

on:
  push:
    branches: ["**"]
    tags: ["actions-check-*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 发布构建矩阵在 release.yml 单独维护。
        os: [windows-latest, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # verified 2026-10-26
        with:
          # 与 rust-toolchain.toml 一致；升级需同步依赖决策记录
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Test
        # 业务测试共享插件依赖缓存，串行准备依赖以避免竞争同一把锁。
        run: cargo test --workspace --locked -- --test-threads=1
      - name: Core-only CLI build (no Rig)
        run: cargo build -p project-knowledge-cli --no-default-features --locked
      - name: Dependency direction (Core must not see Rig)
        run: node scripts/verify-core-dependencies.mjs

  node:
    name: Node 24
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本取自 package.json 的 packageManager（10.34.8）
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      - run: pnpm run build:ts
      - run: pnpm run check:contracts
      - run: node scripts/verify-vectors.mjs
      - run: pnpm run verify:docs
      - name: Install locked probe-only Compiler API
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix docs/evidence/T00/probe/node
      - name: Native, stdio MCP, Rig and Python probes
        run: pnpm run verify:probes
      - name: Build dependency-host CLI
        run: cargo build -p project-knowledge-cli --no-default-features --locked
      - name: Build product native binding
        run: pnpm run build:native
      - name: SDK parity, read-only queries, cancellation and close
        run: pnpm run test:sdk
      - name: Product stdio MCP schemas, modes, resources, cancellation and close
        run: pnpm run test:mcp
      - name: Locked npm/pip preparation and cache-only collection
        run: pnpm run verify:dependencies
