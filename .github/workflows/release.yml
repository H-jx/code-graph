name: Project Knowledge Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            artifact: project-knowledge-win32-x64-msvc
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            artifact: project-knowledge-linux-x64-gnu
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            artifact: project-knowledge-darwin-x64
          - target: aarch64-apple-darwin
            # macos-14 于 2026-11-02 退役（actions/runner-images#15226）；
            # 2026-11-11 核对官方清单改用 macos-15（arm64）。
            runner: macos-15
            artifact: project-knowledge-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify project
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          python scripts/verify-final.py
          node scripts/verify-acceptance.mjs
      - name: Build and verify release candidate
        run: cargo run -p xtask -- package --target ${{ matrix.target }}
      - name: Verify isolated package installation
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $candidate = Get-ChildItem -LiteralPath target/release-candidate/0.1.0/${{ matrix.target }} -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          pnpm run verify:packages -- --artifacts $candidate.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify isolated package installation
        if: runner.os != 'Windows'
        run: pnpm run verify:packages -- --artifacts "$(find target/release-candidate/0.1.0/${{ matrix.target }} -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release-candidate/**/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-release
          path: target/release-candidate/**
          if-no-files-found: error

  publish:
    name: Publish npm packages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: project-knowledge-*-release
          path: candidates
          merge-multiple: true
      - name: Publish platform and wrapper packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for package in candidates/*/*.tgz; do
            npm publish "$package" --access public --ignore-scripts
          done
      - uses: actions/download-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          pattern: project-knowledge-*-release
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/**/project-knowledge-*.tar.gz release-assets/**/release-manifest.json release-assets/**/sbom.json release-assets/**/SHA256SUMS --verify-tag --generate-notes
