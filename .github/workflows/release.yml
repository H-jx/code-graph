name: Release

# 计划 §6.2 首版平台矩阵（四平台）：Windows x64 MSVC、Linux x64 glibc、macOS x64、macOS arm64。
# 首版不发布 Windows arm64、Linux arm64/musl、浏览器或 WASM；glibc 下限由实测构建记录写入发布清单。
# 触发：v* 标签。发布作业需要人工批准的 `release` 环境；未获授权时只产出可审查制品，不公开发布。

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  matrix:
    name: Build ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: windows-x64
            target: x86_64-pc-windows-msvc
            suffix: win32-x64-msvc
            ext: zip
          - os: ubuntu-24.04
            os_name: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64-gnu
            ext: tar.gz
          - os: macos-15-intel
            os_name: darwin-x64
            target: x86_64-apple-darwin
            suffix: darwin-x64
            ext: tar.gz
          - os: macos-15
            os_name: darwin-arm64
            target: aarch64-apple-darwin
            suffix: darwin-arm64
            ext: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # native 绑定（dist profile：fat LTO + strip）
      - name: Build addon
        working-directory: bindings/node
        run: pnpm exec napi build --target ${{ matrix.target }} --platform --profile dist --output-dir artifacts --strip
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.suffix }}
          path: bindings/node/artifacts/project-knowledge-native.${{ matrix.suffix }}.node
          if-no-files-found: error

      # CLI：默认含 Agent；另附 Core-only 构建说明（计划 §6.3 第 2 步）
      - name: Build CLI (default features)
        run: cargo build -p project-knowledge-cli --bin project-knowledge --profile dist --target ${{ matrix.target }}
      - name: Package CLI
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/dist/project-knowledge"
          [ -f "${bin}.exe" ] && bin="${bin}.exe"
          mkdir -p out && cp "$bin" out/
          sha256sum out/* | sed 's#out/##' > "project-knowledge-${{ matrix.target }}.sha256"
          cd out
          if [ "${{ matrix.ext }}" = "zip" ]; then 7z a -tzip "../project-knowledge-${{ matrix.target }}.zip" .
          else tar czf "../project-knowledge-${{ matrix.target }}.tar.gz" .; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            project-knowledge-${{ matrix.target }}.${{ matrix.ext }}
            project-knowledge-${{ matrix.target }}.sha256
          if-no-files-found: error

  publish:
    name: Publish (manual approval)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: matrix
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: bindings/node/artifacts
          merge-multiple: true
      - name: Create platform package dirs
        working-directory: bindings/node
        run: pnpm exec napi create-npm-dirs
      - name: Collect artifacts
        working-directory: bindings/node
        run: pnpm exec napi artifacts --artifacts-dir artifacts --npm-dir npm
      # 计划 §6.3：先平台包 → native root → SDK → MCP；包名与发布权限须已在 T23 核验。
      - name: Publish
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec napi pre-publish -t npm
