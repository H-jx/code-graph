# Rust workspace：Core / Agent / CLI / Node binding / xtask
# 版本与 feature 统一在这里声明，子 crate 只写 `workspace = true`
[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/agent",
  "crates/cli",
  "bindings/node",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV：由 rig = "=0.45.0" 的发布元数据决定（要求 rustc 1.97.1）。
# 工具链由 rust-toolchain.toml 固定，不使用浮动 stable。
# 其余下限：parking_lot 0.13 = 1.95；uuid 1.29 = 1.89；rusqlite 0.41 = 1.89；
# tree-sitter 0.27 = 1.90；ignore 0.4.33 = 1.88；napi 3 = 1.88。
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/project-knowledge"
authors = ["project-knowledge maintainers"]

[workspace.lints.rust]
# 默认禁止不安全代码；只有 Windows Job Object 的 FFI 封装显式放行（见 crates/core/src/collect/process.rs）。
unsafe_code = "deny"
unused_lifetimes = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
type_complexity = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# CoreError 是统一协议错误信封（计划 D02），体积来自可选字段与 issues 列表；
# 缩小它会牺牲可读性或协议完整性，因此显式允许该 lint。
result_large_err = "allow"

[workspace.dependencies]
# ---------------------------------------------------------------- 序列化与契约
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# 契约的 JSON Schema 唯一来源；SDK/MCP 类型由它生成
schemars = "1.2.3"
indexmap = { version = "2.14.2", features = ["serde"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
async-trait = "0.1.92"

# ---------------------------------------------------------------- 异步、进程与并发
tokio = { version = "1.54.1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "sync",
  "time",
  "fs",
] }
# CancellationToken：提取器超时与取消（默认 feature 全关，只用 sync 原语）
tokio-util = { version = "0.7.20", default-features = false }
futures = "0.3.34"
rayon = "1.12.0"
parking_lot = "0.13.0"
arc-swap = "1.9.3"

# ---------------------------------------------------------------- 文件发现与范围
ignore = "0.4.33"
globset = { version = "0.4.20", features = ["serde1"] }
regex = "1.13.1"
walkdir = "2.5.0"
dirs = "7.0.0"
home = "0.5.12"
pathdiff = "0.2.3"
url = { version = "2.5.8", features = ["serde"] }

# ---------------------------------------------------------------- 存储与检索
# bundled 会编译 sqlite3.c 并打开 SQLITE_ENABLE_FTS5 / JSON1 / RTREE，需要 C 编译器
# （Windows 上是 MSVC Build Tools）。显式关闭 default（其含 ffi-sqlite-wasm-rs）。
# backup：候选验证要用 Online Backup API 制作一致快照，不能只复制 WAL 主文件（计划 T04）。
rusqlite = { version = "0.41.0", default-features = false, features = [
  "bundled",
  "backup",
  "cache",
  "chrono",
  "serde_json",
  "limits",
  "hooks",
  "trace",
] }

# ---------------------------------------------------------------- 校验与证据
# 关掉 resolve-http/tls-aws-lc-rs：本机 Windows 构建不需要网络取 schema，
# 也避免 aws-lc-sys 对 cmake/nasm 的额外要求。
jsonschema = { version = "0.60.1", default-features = false, features = ["resolve-file"] }
# 计划 §2.2：sha2 固定 0.10.x（0.11 已发布，本版本不跟进，避免同时改动哈希 API）
sha2 = "0.10.9"
hex = "0.4.3"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
tempfile = "3.27.0"

# ---------------------------------------------------------------- 语法（可选能力）
# 计划 D18/T05：首版内置 TS/TSX/JS/Python 的基础声明与保守引用；
# 其他语言只作文本检索。SCIP 与 Repomix 属后续接入，本版不引入依赖。
# grammar 的精确版本与 ABI 需在 T00 实测后固化（当前用 crates.io 最新稳定 patch）。
tree-sitter = "0.27.1"
tree-sitter-language = "0.1.9"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"

# ---------------------------------------------------------------- 时间与图
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
petgraph = "0.8.3"
rustc-hash = "2.1.3"

# ---------------------------------------------------------------- 输出与渲染
handlebars = "6.4.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# ---------------------------------------------------------------- Agent（Rig）
# 计划 D12：使用 `rig` facade 的简单 Agent，精确锁定 0.45.0（要求 rustc 1.97.1）。
# default features = rig-core/default + reqwest + agent + derive + rustls，即已含 Agent 与 rustls。
rig = { version = "=0.45.0", features = ["agent", "derive", "reqwest", "rustls"] }
include_dir = "0.7.4"

# ---------------------------------------------------------------- CLI
clap = { version = "4.6.7", features = ["derive", "env", "cargo", "wrap_help"] }
clap_complete = "4.6.11"
dialoguer = { version = "0.12.0", default-features = false }
comfy-table = "8.0.1"
indicatif = "0.18.6"

# ---------------------------------------------------------------- Node binding
# 计划 §2.2：napi / napi-derive / @napi-rs/cli 固定 v3 系列精确 patch，Node-API 级别取 8。
napi = { version = "3.15.0", default-features = false, features = [
  "napi8",
  "dyn-symbols",
  "tokio_rt",
  "serde-json",
  "error_anyhow",
] }
napi-derive = "3.6.13"
napi-build = "2.6.0"

# ---------------------------------------------------------------- 构建辅助
cargo_metadata = "0.23.1"

# ---------------------------------------------------------------- 进程树终止
# Unix：独立进程组 + killpg；Windows：Job Object（KILL_ON_JOB_CLOSE）。
# 只终止本次运行拥有的进程，不按进程名匹配。
libc = { version = "0.2.174", default-features = false }
windows-sys = { version = "0.61.2", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# ---------------------------------------------------------------- 测试
insta = { version = "1.49.0", features = ["json", "redactions"] }
proptest = "1.12.0"

# ---------------------------------------------------------------- 内部 crate
project-knowledge-core = { path = "crates/core", version = "0.1.0" }
project-knowledge-agent = { path = "crates/agent", version = "0.1.0" }
project-knowledge-cli = { path = "crates/cli", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind" # napi 需要捕获 panic，不要改成 abort
strip = "debuginfo"

# 发布产物（CLI 二进制 / native .node）用 fat LTO
[profile.dist]
inherits = "release"
lto = "fat"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1 # 依赖库稍作优化，扫描/哈希类调试不至于太慢
